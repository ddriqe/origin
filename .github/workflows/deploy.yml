name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /origin
      - name: Setup Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable Pages
        id: enable
        continue-on-error: true
        run: |
          code=$(curl -sS -o pages-api.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}')
          echo "http_status=$code" | tee enable-status.txt
          test "$code" = "201" -o "$code" = "409" -o "$code" = "200"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.enable.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Publish API result
        if: always()
        run: |
          mkdir -p /tmp/pages-result
          cp pages-api.json enable-status.txt /tmp/pages-result/ || true
          git config user.name "Cursor Agent"
          git config user.email "cursoragent@cursor.com"
          git checkout --orphan pages-status
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/pages-result/pages-api.json /tmp/pages-result/enable-status.txt . || true
          printf '%s\n' "enable=${{ steps.enable.outcome }}" "deploy=${{ steps.deployment.outcome }}" "sha=${{ github.sha }}" > result.txt
          git add result.txt pages-api.json enable-status.txt
          git commit -m "Record Pages API result"
          git push --force origin pages-status
